name: Auto Generate 2026 AI Audit Sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Audit Sitemap
        run: |
          python3 -c '
          brands = [
            "gymshark.com", "boat-lifestyle.com", "mamaearth.in", "nykaa.com", "glossier.com",
            "fashionnova.com", "allbirds.com", "colourpop.com", "lenskart.com", "sugarcosmetics.com",
            "kyliecosmetics.com", "fentybeauty.com", "bombas.com", "warbyparker.com", "casper.com",
            "awaytravel.com", "brooklinen.com", "puravida.com", "mvmt.com", "ridge.com",
            "beardbrand.com", "huel.com", "athleticgreens.com", "chubbies.com", "untuckit.com",
            "rothys.com", "everlane.com", "reformation.com", "alo.com", "lululemon.com",
            "sephora.com", "ulta.com", "asos.com", "boohoo.com", "prettylittlething.com",
            "shein.com", "zara.com", "hm.com", "uniqlo.com", "mango.com",
            "bewakoof.com", "souledstore.com", "snitch.co.in", "mcaffeine.com", "plumgoodness.com",
            "wowskinscience.com", "minimalist.co", "dotandkey.com", "forestessentialsindia.com", "kamaayurveda.com"
          ]
          categories = ["shopify", "skincare", "fashion", "electronics", "jewelry", "fitness", "beauty", "home-decor", "supplements", "pet-care"]
          urls = ["  <url><loc>https://mobiappsystems.com</loc><priority>0.9</priority></url>"]
          for b in brands:
              urls.append(f"  <url><loc>https://mobiappsystems.com?brand={b}</loc><priority>0.8</priority></url>")
          for i in range(1, 501):
              for c in categories:
                  urls.append(f"  <url><loc>https://mobiappsystems.com?brand={c}-store-{i}.com</loc><priority>0.7</priority></url>")
          xml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://sitemaps.org\">\n" + "\n".join(urls) + "\n</urlset>"
          with open("sitemap-audit.xml", "w") as f:
              f.write(xml)
          '
      - name: Commit Sitemap
        run: |
          git config user.name "Mobiapp Bot"
          git config user.email "admin@mobiappsystems.com"
          git add sitemap-audit.xml
          git commit -m "Auto-update 5,000+ AI audit URLs" || exit 0
          git push
